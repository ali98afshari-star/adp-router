[package]
name = "adp-router-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core routing engine for ADP (Application Data Protocol)"
repository = "https://github.com/ali98afshari-star/adp-router"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Networking (for later)
# socket2 = "0.5"

[dev-dependencies]
pretty_assertions = "1.0"